<svg xmlns="http://www.w3.org/2000/svg"
     width="32" height="32" viewBox="0 0 32 32"
     role="img" aria-labelledby="title desc">
  <title id="title">Tpipe Tp mark</title>
  <desc id="desc">Fused white T and cyan p monogram on a black background.</desc>

  <!-- Solid favicon background. -->
  <rect width="32" height="32" rx="6" fill="#070A10"/>

  <!-- T: joined to p along the shared vertical edge. -->
