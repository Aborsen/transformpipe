  <!-- p: one large bowl and stem, simplified for 16 px. -->
  <path fill="#19D3D1" fill-rule="evenodd" d="M14 5h6c5.8 0 9 3.4 9 8.5S25.8 22 20 22h-1v5h-5V5Zm5 5v7h1c2.7 0 4-1.1 4-3.5S22.7 10 20 10h-1Z"/>
