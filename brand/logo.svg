  <title id="title">Tpipe</title>
  <desc id="desc">Tpipe wordmark with a fused T and p ligature.</desc>

  <!--
    Default: light wordmark for dark surfaces.
    For a dark-on-light treatment, replace #F7F9FC with #111827.
  -->

  <!-- Capital T: joined to the first p along the shared vertical edge. -->
  <path fill="#F7F9FC" d="M4 3h16a2 2 0 0 1 2 2v3h-7v21a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V8H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/>

  <!-- First p: fused with T. -->
  <path fill="#19D3D1" fill-rule="evenodd" d="M15 3h9c7.2 0 12 4.7 12 11.5S31.2 26 24 26h-3v3a2 2 0 0 1-2 2h-4V3Zm6 6v11h3c3.7 0 6-2 6-5.5S27.7 9 24 9h-3Z"/>

  <!-- i -->
  <circle fill="#F7F9FC" cx="43" cy="5.5" r="3"/>
  <path fill="#F7F9FC" d="M40 10h6v19a2 2 0 0 1-2 2h-4V10Z"/>

  <!-- Second p -->
  <path fill="#19D3D1" fill-rule="evenodd" d="M50 10h9c6.3 0 10.5 3.8 10.5 9.5S65.3 29 59 29h-3v3h-6V10Zm6 5v9h3c2.8 0 4.5-1.6 4.5-4.5S61.8 15 59 15h-3Z"/>

  <!-- e -->
